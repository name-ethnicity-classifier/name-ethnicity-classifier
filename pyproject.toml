[project]
name = "n2e"
version = "0.1.0"
description = "n2e is a Python package and CLI tool that classifies names into ethnicities."
readme = "README.md"
authors = [
    { name = "Theodor Peifer", email = "teddypeifer@gmail.com" }
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "ethnicity-classification",
    "name-classification",
    "nationality-prediction",
    "bias-detection",
    "social-science",
    "machine-learning",
    "nlp",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "torch>=2.13.0",
]

[project.urls]
Homepage = "https://www.name-to-ethnicity.com"
Repository = "https://github.com/name-ethnicity-classifier/name-ethnicity-classifier"
Issues = "https://github.com/name-ethnicity-classifier/name-ethnicity-classifier/issues"
Publication = "https://link.springer.com/article/10.1007/s00146-022-01619-4"

[project.scripts]
n2e = "n2e.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"
